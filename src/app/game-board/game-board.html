<h2 class="my-3 text-2xl font-bold sm:my-5 short:hidden">KANJI TYPING</h2>

<div class="mb-2 flex w-full max-w-125 items-center justify-between gap-2 text-sm text-muted">
  <span>
    Tiến độ: <b class="text-accent">{{ game.index() }}</b> /
    <b class="text-accent">{{ game.total() }}</b>
  </span>
  <span>
    Lỗi: <b class="text-danger">{{ game.fails() }}</b> /
    <b class="text-danger">{{ maxFails }}</b>
  </span>
  <button (click)="game.goHome()" class="btn-ghost">⌂ Home</button>
</div>

<!-- Height shrinks on short screens (e.g. mobile with the keyboard open); the floor sits 3.125rem above the bottom -->
<div
  class="relative h-[min(21.875rem,55dvh)] w-full max-w-125 overflow-hidden rounded-lg border-2 border-line bg-panel"
>
  @if (game.phase() === 'playing' && game.current(); as word) {
    <div
      class="absolute left-[24%] max-w-[72%] rounded border border-line bg-raised px-3 py-1 text-2xl font-bold text-enemy"
      [style.top]="'calc((100% - 3.125rem) * ' + game.progress() + ')'"
    >
      {{ word[game.mode().question] }}
    </div>
  }
</div>

<input
  #answer
  type="text"
  placeholder="Gõ Yomikata rồi ấn Enter..."
  [disabled]="game.phase() !== 'playing'"
  (keydown.enter)="submit($event, answer)"
  class="mt-3.75 w-full max-w-120 rounded-md border bg-canvas p-2.5 text-center text-lg text-accent outline-none transition-colors"
  [class.border-danger]="wrong()"
  [class.border-line]="!wrong()"
/>
