<div
  class="fixed inset-0 z-20 flex flex-col items-center-safe justify-center-safe gap-8 overflow-y-auto bg-canvas p-4 lg:flex-row lg:gap-10 short:flex-row short:items-start short:gap-6"
>
  <div class="flex w-full max-w-89.5 flex-col items-center">
    <a routerLink="/" class="btn-ghost mb-3 self-start short:mb-1">← Chọn game</a>
    <h1 class="mb-1.5 text-3xl font-bold text-accent short:mb-0 short:text-2xl">KANJI TYPING</h1>

    <label class="mt-3 flex cursor-pointer items-center gap-2 text-sm text-fg short:mt-1">
      <input
        type="checkbox"
        class="size-4 cursor-pointer accent-accent"
        [checked]="game.importMode()"
        (change)="game.importMode.set(checked($event))"
      />
      Import Vocabulary
    </label>

    <div class="mt-3 mb-2 flex w-full gap-2 sm:gap-3.5 short:mt-1 short:mb-1">
      <label class="flex min-w-0 flex-1 flex-col gap-1 text-sm text-muted">
        Level
        <select
          class="field-select"
          [disabled]="game.importMode()"
          (change)="game.selectLevel(value($event))"
        >
          @if (game.importMode()) {
            <option selected></option>
          } @else {
            @for (l of levels; track l.id) {
              <option [value]="l.id" [selected]="l.id === game.level()">{{ l.id }}</option>
            }
          }
        </select>
      </label>
      <label class="flex min-w-0 flex-1 flex-col gap-1 text-sm text-muted">
        Lesson
        <select
          class="field-select"
          [disabled]="game.importMode()"
          (change)="game.selectLesson(value($event))"
        >
          @if (game.importMode()) {
            <option selected></option>
          } @else {
            <option [value]="all" [selected]="game.lesson() === all">{{ all }}</option>
            @for (l of lessons(); track l.lessionId) {
              <option [value]="l.lessionId" [selected]="'' + l.lessionId === game.lesson()">
                {{ l.lessionId }}
              </option>
            }
          }
        </select>
      </label>
      <label class="flex min-w-0 flex-1 flex-col gap-1 text-sm text-muted">
        Part
        <select
          class="field-select"
          [disabled]="game.importMode() || game.lesson() === all"
          (change)="game.part.set(value($event))"
        >
          @if (game.importMode()) {
            <option selected></option>
          } @else {
            @for (p of parts(); track p.partId) {
              <option [value]="p.partId" [selected]="'' + p.partId === game.part()">
                {{ p.partId }}
              </option>
            }
          }
        </select>
      </label>
    </div>

    <label class="mt-2 flex w-full flex-col gap-1 text-sm text-muted short:mt-0">
      Session type
      <select class="field-select" (change)="game.selectMode(value($event))">
        @for (m of modes; track m.id) {
          <option [value]="m.id" [selected]="m.id === game.mode().id">{{ m.label }}</option>
        }
      </select>
    </label>

    <p class="mt-4 mb-1 text-muted short:mt-2 short:mb-0 short:text-sm">
      Chọn số từ vựng cho 1 session:
    </p>
    <p class="mb-5 text-xs text-muted short:mb-2">
      @if (game.importMode()) {
        (Dùng từ vựng trong ô Import)
      } @else {
        (Có {{ game.pool().length }} từ trong mục đã chọn)
      }
    </p>
    <div class="flex w-full gap-2 sm:gap-3.5">
      @for (size of sizes; track size) {
        <button
          [appAutoFocus]="size === game.sessionSize()"
          [disabled]="!game.importMode() && game.pool().length === 0"
          (click)="game.startSession(size)"
          class="min-w-0 flex-1 cursor-pointer rounded-lg border-2 border-line bg-panel py-4.5 text-base text-fg short:py-1.5 hover:border-accent focus:border-accent focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
        >
          <b class="mb-1 block text-3xl text-enemy short:mb-0 short:text-xl">{{ size }}</b
          >{{ size === all && !game.importMode() ? game.pool().length + ' từ' : 'từ' }}
        </button>
      }
    </div>
  </div>

  @if (game.importMode()) {
    <div class="flex w-full max-w-110 flex-col gap-1 text-sm text-muted">
      <label for="import-text">Import Vocabulary (mảng Vocab)</label>
      <!-- Phones: shrinks to the height left under the form (34rem) so the screen does not scroll -->
      <textarea
        id="import-text"
        spellcheck="false"
        [placeholder]="placeholder"
        [value]="game.importText()"
        (input)="game.setImportText(value($event))"
        class="h-[clamp(5rem,calc(100dvh-34rem),15rem)] resize-none lg:h-90 short:h-[calc(100dvh-5rem)] rounded-md border bg-panel p-3 font-mono text-xs text-fg placeholder:text-muted/60 focus:outline-none"
        [class]="game.importError() ? 'border-danger' : 'border-line focus:border-accent'"
      ></textarea>
      @if (game.importError()) {
        <p class="text-danger">{{ game.importError() }}</p>
      }
    </div>
  }
</div>
