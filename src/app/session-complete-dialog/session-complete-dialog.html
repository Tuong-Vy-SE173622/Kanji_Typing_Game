<div class="backdrop">
  <div class="w-full max-w-180 rounded-lg border-2 border-success bg-panel p-4 sm:p-6 text-center">
    <h3 class="mb-1.5 text-[1.375rem] font-bold text-success">🎉 CONGRATULATIONS!</h3>
    <div class="mb-4.5 text-[0.8125rem] text-muted">
      Bạn đã hoàn thành session {{ game.total() }} từ.
    </div>

    <div
      class="mb-4.5 max-h-[min(18.75rem,50dvh)] overflow-auto rounded-md border border-line bg-canvas"
    >
      <table class="data-table">
        <thead>
          <tr>
            <th>Kanji</th>
            <th>Yomikata</th>
            <th>Nghĩa</th>
          </tr>
        </thead>
        <tbody>
          @for (w of game.sessionWords(); track $index) {
            <tr>
              <td class="text-base font-bold text-enemy">{{ w.kanji }}</td>
              <td
                title="Nghe phát âm"
                (click)="game.speak(w.yomikata); nextBtn.focus()"
                class="cursor-pointer whitespace-nowrap text-accent hover:underline"
              >
                {{ w.yomikata }}
              </td>
              <td>{{ w.meaning }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="flex flex-wrap justify-center gap-2.5">
      <button #nextBtn appAutoFocus (click)="game.nextSession()" class="btn-primary">
        Session tiếp theo (Enter)
      </button>
      <button (click)="game.goHome()" class="btn-secondary">Về Home</button>
    </div>
  </div>
</div>
